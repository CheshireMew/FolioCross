[project]
name = "foliocross"
version = "0.1.0"
description = "Local-first desktop book translation workspace."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FolioCross contributors" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "ebooklib>=0.18",
  "keyring>=25.0",
  "lxml>=5.0",
  "openai>=1.40",
  "pydantic>=2.7",
  "PySide6>=6.7",
  "python-docx>=1.2",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "ruff>=0.12",
]

[project.scripts]
foliocross = "foliocross.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foliocross"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]
